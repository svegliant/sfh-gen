[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sfh-gen"
version = "0.1.0"
description = "Singlet Fission Hamiltonian pipeline for OpenMolcas"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Simone Veglianti", email = "simoneveglianti1@gmail.com"},
]
dependencies = [
    "numpy",
    "scipy",
    "h5py",
    "pyyaml",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Intended Audience :: Science/Research",
]

[project.urls]
Homepage = "https://github.com/svegliant/sfh-gen"
Issues = "https://github.com/svegliant/sfh-gen/issues"

# Needed only by split_dimer.py, to split the dimer automatically when
# paths.monomer1 / monomer2 are not given in the config.
#   pip install sfh_gen[split]
# Capped below 3: the automatic split uses MDAnalysis bond guessing, whose
# API changes in 3.x.
[project.optional-dependencies]
split = ["MDAnalysis>=2.0,<3"]

[project.scripts]
sfh-gen = "sfh_gen.cli:main"

[tool.setuptools.packages.find]
include = ["sfh_gen*"]

# The commented config.yaml that `sfh-gen` writes into an empty directory.
[tool.setuptools.package-data]
sfh_gen = ["default_config.yaml"]

# --strict-markers so a mistyped marker is an error rather than a test that
# quietly never runs. The suite needs no OpenMolcas; the one marker reserves a
# name for the cases that would.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "qm: needs a working OpenMolcas installation; not run in CI",
]
